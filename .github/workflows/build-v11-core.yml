name: Build V11 Wii U Release

on:
  push:
    branches:
      - feature/v11-renderer-optimization
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest

    steps:
      - name: Checkout V11
        uses: actions/checkout@v4

      - name: Run host performance tests
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Iinclude tests/render_policy_tests.cpp -o /tmp/render_policy_test
          /tmp/render_policy_test
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Iinclude tests/skinning_tests.cpp -o /tmp/skinning_test
          /tmp/skinning_test
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Iinclude tests/world_asset_layout_tests.cpp -o /tmp/world_asset_layout_test
          /tmp/world_asset_layout_test
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Iinclude tests/performance_geometry_tests.cpp -o /tmp/performance_geometry_test
          /tmp/performance_geometry_test
          python3 tests/ui_buffer_isolation_test.py
          python3 tests/indexed_actor_renderer_test.py

      - name: Validate core assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_assets.py

      - name: Download CafeGLSL host compiler
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          url = 'https://github.com/Exzap/CafeGLSL/releases/download/v0.2.0/glslcompiler.elf'
          urllib.request.urlretrieve(url, '/tmp/glslcompiler.elf')
          PY
          chmod +x /tmp/glslcompiler.elf

      - name: Compile shaders
        shell: bash
        run: |
          set -euo pipefail
          CAFEGLSL_COMPILER=/tmp/glslcompiler.elf bash ./tools/compile_shaders.sh
          test -s content/shaders/scene3d.gsh
          test -s content/shaders/actor3d.gsh
          test -s content/shaders/ui2d.gsh

      - name: Configure Wii U release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake \
            -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build RPX and WUHB
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build -j2
          test -s build/arena_assault.rpx
          test -s build/ArenaAssault.wuhb
          test -s build/sd/wiiu/apps/ArenaAssault/ArenaAssault.wuhb

      - name: Package Aroma SD ZIP and builder tools
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package_sd.py build/ArenaAssault.wuhb -o ArenaAssault_Aroma_SD_V11_CORE.zip
          test -s ArenaAssault_Aroma_SD_V11_CORE.zip

          mkdir -p ci-artifact/wiiu/apps/ArenaAssault ci-artifact/core/shaders ci-artifact/host-tools/lib
          cp build/ArenaAssault.wuhb ci-artifact/ArenaAssault_CORE.wuhb
          cp build/ArenaAssault.wuhb ci-artifact/wiiu/apps/ArenaAssault/ArenaAssault.wuhb
          cp build/arena_assault.rpx ci-artifact/core/arena_assault.rpx
          cp content/shaders/scene3d.gsh ci-artifact/core/shaders/scene3d.gsh
          cp content/shaders/actor3d.gsh ci-artifact/core/shaders/actor3d.gsh
          cp content/shaders/ui2d.gsh ci-artifact/core/shaders/ui2d.gsh
          cp ArenaAssault_Aroma_SD_V11_CORE.zip ci-artifact/ArenaAssault_Aroma_SD_V11_CORE.zip

          # Export the exact official host wuhbtool used by devkitPro/WUT.
          WUHBTOOL="$(command -v wuhbtool || true)"
          if [ -z "$WUHBTOOL" ]; then
            WUHBTOOL="$(find /opt/devkitpro -type f -name wuhbtool -perm -111 2>/dev/null | head -n1)"
          fi
          test -n "$WUHBTOOL"
          test -x "$WUHBTOOL"
          cp -L "$WUHBTOOL" ci-artifact/host-tools/wuhbtool
          chmod +x ci-artifact/host-tools/wuhbtool
          ldd "$WUHBTOOL" | tee ci-artifact/host-tools/wuhbtool.ldd.txt
          ldd "$WUHBTOOL" | awk '{for (i=1;i<=NF;i++) if ($i ~ /^\//) print $i}' | sort -u | while read -r lib; do
            [ -f "$lib" ] && cp -L "$lib" ci-artifact/host-tools/lib/
          done

          # Full source snapshot like the older safe project releases. Use
          # Python rather than git archive so container ownership cannot break
          # packaging. Generated GSH files from this exact build are included.
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('.')
          out = Path('ci-artifact/ArenaAssault_V11_SOURCE_BASE.zip')
          skip_roots = {'.git', 'build', 'ci-artifact'}
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if not p.is_file():
                      continue
                  rel = p.relative_to(root)
                  if rel.parts and rel.parts[0] in skip_roots:
                      continue
                  z.write(p, rel.as_posix())
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              names = set(z.namelist())
              for required in (
                  'CMakeLists.txt', 'src/actor_renderer.cpp', 'include/renderer.hpp',
                  'content/shaders/scene3d.gsh', 'content/shaders/actor3d.gsh',
                  'content/shaders/ui2d.gsh', 'meta/icon.png'):
                  assert required in names, required
          print(out)
          PY

          python3 - <<'PY'
          import zipfile
          p='ArenaAssault_Aroma_SD_V11_CORE.zip'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert 'wiiu/apps/ArenaAssault/ArenaAssault.wuhb' in z.namelist()
          print('CORE ZIP verification OK')
          PY

      - name: Upload V11 core release
        uses: actions/upload-artifact@v4
        with:
          name: ArenaAssault-V11-Core
          path: ci-artifact/
          if-no-files-found: error
